services:
  arangodb:
    image: arangodb/arangodb:3.12
    environment:
      ARANGO_ROOT_PASSWORD: dev
    ports:
      - 8529
    healthcheck:
      test: ["CMD-SHELL", "arangosh --server.password dev --javascript.execute-string 'require(\"@arangodb\").db._version()' || exit 1"]
      interval: 5s
      timeout: 10s
      retries: 20
      start_period: 10s

  cube:
    build:
      context: ./test/e2e
      dockerfile: Dockerfile
    environment:
      - CUBEJS_DEV_MODE=true
      - CUBEJS_DB_TYPE=arangodb
      - CUBEJS_DB_URL=http://arangodb:8529
      - CUBEJS_DB_NAME=_system
      - CUBEJS_DB_USER=root
      - CUBEJS_DB_PASS=dev
      - CUBEJS_API_SECRET=e2e-secret
      - CUBEJS_LOG_LEVEL=warn
    ports:
      - 4000
    volumes:
      - ./test/e2e/model:/cube/conf/model
    depends_on:
      arangodb:
        condition: service_healthy
