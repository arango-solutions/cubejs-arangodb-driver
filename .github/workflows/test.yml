# This workflow installs dependencies, builds the driver, and runs unit,
# integration (testcontainers), and end-to-end (Cube + ArangoDB) tests.
# For more information see: https://help.github.com/actions/language-and-framework-guides/using-nodejs-with-github-actions

name: Test CI

on:
  push:
    branches: [ "main" ]
    paths:
      - src/**
      - test/**
      - docker/**
      - docker-compose*.yml
      - package.json
      - package-lock.json
      - tsconfig.base.json
      - tsconfig.json
  pull_request:
    branches: [ "main" ]
    paths:
      - src/**
      - test/**
      - docker/**
      - docker-compose*.yml
      - package.json
      - package-lock.json
      - tsconfig.base.json
      - tsconfig.json

jobs:
  unit:
    name: Unit (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest

    strategy:
      matrix:
        # See supported Node.js release schedule at https://nodejs.org/en/about/releases/
        node-version: [20.x, 22.x]

    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npm test

  integration:
    name: Integration (testcontainers)
    runs-on: ubuntu-latest
    needs: unit

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: 'npm'
      - run: npm ci
      - run: npm run build
      - run: npm run test:integration

  e2e:
    name: E2E (Cube + ArangoDB)
    runs-on: ubuntu-latest
    needs: integration

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: 'npm'
      - run: npm ci
      - run: npm run test:e2e
